<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Boutique Démo</title>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; }
    input { display: block; width: 100%; margin: 8px 0; padding: 8px; box-sizing: border-box; }
    .error { color: #b00020; display: none; }
  </style>
</head>
<body>
  <h1>Boutique Démo</h1>
  <p>Site local servant aux tests automatiques de l'agent.</p>
  <form id="login-form">
    <input id="user-name" name="user-name" placeholder="Identifiant" autocomplete="off">
    <input id="password" name="password" type="password" placeholder="Mot de passe">
    <input type="submit" data-test="login-button" value="Connexion">
  </form>
  <p class="error" data-test="error">Identifiant ou mot de passe incorrect</p>
  <script>
    document.getElementById('login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const user = document.getElementById('user-name').value;
      const password = document.getElementById('password').value;
      if (user === 'standard_user' && password === 'secret_sauce') {
        window.location.href = 'inventory.html';
      } else {
        document.querySelector('[data-test=error]').style.display = 'block';
      }
    });
  </script>
</body>
</html>
